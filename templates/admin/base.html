<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - Smart Parking{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Admin Top Header Navbar -->
    <header class="navbar navbar-dark glass-nav px-4 py-2 border-bottom border-secondary">
        <div class="d-flex align-items-center gap-3">
            <a href="{{ url_for('views.index') }}" class="navbar-brand d-flex align-items-center gap-2">
                <div class="brand-icon-box bg-cyan text-dark rounded-3 px-2 py-1 fw-bold fs-6">
                    <i class="fas fa-parking"></i>
                </div>
                <span class="fs-5 fw-bold text-white">SMART <span class="text-cyan">PARKING</span> <span class="badge bg-warning text-dark ms-2 font-monospace fs-6">ADMIN</span></span>
            </a>
        </div>

        <div class="d-flex align-items-center gap-3">
            <!-- DEMO MODE SIMULATOR TRIGGER -->
            <button onclick="triggerDemoSimulation()" class="btn btn-outline-warning btn-sm fw-semibold">
                <i class="fas fa-bolt me-1 animate-bounce"></i> Simulate Live Parking (DEMO)
            </button>
            
            <a href="{{ url_for('views.index') }}" class="btn btn-glass btn-sm"><i class="fas fa-globe me-1"></i> User View</a>
            <a href="{{ url_for('auth.api_logout') }}" class="btn btn-outline-danger btn-sm"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </header>

    <div class="admin-layout">
        <!-- Admin Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="text-white-50 small font-monospace text-uppercase px-3 mb-2">Navigation</div>
            
            <a href="{{ url_for('views.admin_dashboard') }}" class="nav-link {% if request.path == '/admin' %}active{% endif %}">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="{{ url_for('views.admin_live_map') }}" class="nav-link {% if request.path == '/admin/live-map' %}active{% endif %}">
                <i class="fas fa-cube text-cyan"></i> Live 3D Admin Map
            </a>
            <a href="{{ url_for('views.admin_malls') }}" class="nav-link {% if request.path == '/admin/malls' %}active{% endif %}">
                <i class="fas fa-building"></i> Cities & Malls
            </a>
            <a href="{{ url_for('views.admin_slots') }}" class="nav-link {% if request.path == '/admin/slots' %}active{% endif %}">
                <i class="fas fa-parking"></i> Parking Slots
            </a>
            <a href="{{ url_for('views.admin_bookings') }}" class="nav-link {% if request.path == '/admin/bookings' %}active{% endif %}">
                <i class="fas fa-credit-card"></i> Payments & Bookings
            </a>
        </aside>

        <!-- Main Admin Content -->
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

    <!-- Bootstrap & Chart.js Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
