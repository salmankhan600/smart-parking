{% extends 'base.html' %}

{% block title %}Register - Smart Parking{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center py-lg-4">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-icon-box bg-cyan text-dark rounded-3 d-inline-block px-3 py-2 mb-3">
                        <i class="fas fa-user-plus fs-3"></i>
                    </div>
                    <h3 class="text-white fw-bold">Create Account</h3>
                    <p class="text-white-50 small">Join Smart Parking for seamless 3D mall parking</p>
                </div>

                <form id="register-form">
                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-semibold">Full Name</label>
                        <input type="text" id="name" class="form-control form-control-glass" placeholder="John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-semibold">Email Address</label>
                        <input type="email" id="email" class="form-control form-control-glass" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-semibold">Phone Number</label>
                        <input type="tel" id="phone" class="form-control form-control-glass" placeholder="9876543210">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white-50 small fw-semibold">Password</label>
                        <input type="password" id="password" class="form-control form-control-glass" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-neon-cyan w-100 py-3 mb-3 fw-semibold">
                        <i class="fas fa-user-check me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center border-top border-secondary border-opacity-25 pt-3">
                    <span class="text-white-50 small">Already registered?</span>
                    <a href="{{ url_for('views.login_page') }}" class="text-cyan text-decoration-none fw-semibold ms-1">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();
        if (data.success) {
            showToast(data.message, 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 600);
        } else {
            showToast(data.message, 'error');
        }
    } catch (err) {
        showToast("Registration failed.", "error");
    }
});
</script>
{% endblock %}
{% endblock %}
